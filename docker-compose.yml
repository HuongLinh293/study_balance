name: studybalance
services:
  mysql:
    restart: unless-stopped
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_change_me}
    ports: ["127.0.0.1:3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./infrastructure/mysql/conf/primary.cnf:/etc/mysql/conf.d/replication.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
  # Read-only copy of every service database (GTID replication). See docs/backup.md.
  mysql-replica:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_change_me}
    ports: ["127.0.0.1:3307:3306"]
    volumes:
      - mysql_replica_data:/var/lib/mysql
      # Same databases and service accounts, so the replica can be promoted on failover.
      - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./infrastructure/mysql/conf/replica.cnf:/etc/mysql/conf.d/replication.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    depends_on:
      mysql: { condition: service_healthy }
  replica-setup:
    image: mysql:8.4
    entrypoint: ["/bin/bash", "/replica-setup.sh"]
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_change_me}
      MYSQL_REPLICATION_PASSWORD: ${MYSQL_REPLICATION_PASSWORD:-local_repl_change_me}
    volumes:
      - ./infrastructure/mysql/replica-setup.sh:/replica-setup.sh:ro
    depends_on:
      mysql: { condition: service_healthy }
      mysql-replica: { condition: service_healthy }
  backup:
    image: mysql:8.4
    entrypoint: ["/bin/bash", "/backup.sh"]
    command: ["loop"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_change_me}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./infrastructure/backup/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      mysql: { condition: service_healthy }
  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-studybalance}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-local_broker_change_me}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15
  user-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    environment:
      PORT: 3001
      REFRESH_COOKIE_PATH: /api/user/auth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8088}
      PLANNING_SERVICE_URL: http://planning-service:3003
      TASK_SERVICE_URL: http://task-service:3002
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: mysql://user_app:local_user_change_me@mysql:3306/user_db
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-studybalance}:${RABBITMQ_DEFAULT_PASS:-local_broker_change_me}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-local_jwt_secret_change_me_0123456789abcdef}
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  task-service:
    restart: unless-stopped
    # Two replicas: Nginx balances requests, both consume events from one queue.
    deploy: { replicas: 2 }
    build:
      context: .
      dockerfile: services/task-service/Dockerfile
    environment:
      PORT: 3002
      DATABASE_URL: mysql://task_app:local_task_change_me@mysql:3306/task_db
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-studybalance}:${RABBITMQ_DEFAULT_PASS:-local_broker_change_me}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-local_jwt_secret_change_me_0123456789abcdef}
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  planning-service:
    restart: unless-stopped
    # Two replicas: Nginx balances requests, both consume events from one queue.
    deploy: { replicas: 2 }
    build:
      context: .
      dockerfile: services/planning-service/Dockerfile
    environment:
      PORT: 3003
      DATABASE_URL: mysql://planning_app:local_planning_change_me@mysql:3306/planning_db
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-studybalance}:${RABBITMQ_DEFAULT_PASS:-local_broker_change_me}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-local_jwt_secret_change_me_0123456789abcdef}
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  notification-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      PORT: 3004
      DATABASE_URL: mysql://notification_app:local_notification_change_me@mysql:3306/notification_db
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-studybalance}:${RABBITMQ_DEFAULT_PASS:-local_broker_change_me}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-local_jwt_secret_change_me_0123456789abcdef}
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3004/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  analytics-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    environment:
      PORT: 3005
      DATABASE_URL: mysql://analytics_app:local_analytics_change_me@mysql:3306/analytics_db
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-studybalance}:${RABBITMQ_DEFAULT_PASS:-local_broker_change_me}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-local_jwt_secret_change_me_0123456789abcdef}
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3005/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
  gateway:
    restart: unless-stopped
    image: nginx:stable-alpine
    ports: ["127.0.0.1:${GATEWAY_PORT:-8080}:80"]
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend: { condition: service_started }
      user-service: { condition: service_healthy }
      task-service: { condition: service_healthy }
      planning-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
      analytics-service: { condition: service_healthy }
  # Monitoring: Prometheus scrapes /metrics of every replica; Grafana shows the dashboard.
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local_grafana_change_me}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/studybalance.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports: ["127.0.0.1:${GRAFANA_PORT:-3030}:3000"]
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus: { condition: service_started }
volumes:
  mysql_data:
  mysql_replica_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
